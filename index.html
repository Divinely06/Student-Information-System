<!DOCTYPE html>
<html>
<head>
    <title>Student Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Information System</h1>

    <h2>Add / Update Student</h2>
    <form id="studentForm">
        <input type="text" id="student_id" placeholder="Student ID" required>
        <input type="text" id="student_name" placeholder="Student Name" required>
        <input type="text" id="program" placeholder="Program" required>
        <input type="number" id="year_level" placeholder="Year Level" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="button" onclick="addStudent()">Add Student</button>
        <button type="button" onclick="updateStudent()">Update Student</button>
    </form>

    <h2>Student Records</h2>
    <button onclick="loadStudents()">Load Students</button>
    <table border="1">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Program</th>
                <th>Year Level</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable">
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
